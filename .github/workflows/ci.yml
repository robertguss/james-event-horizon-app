name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Overnight / PR CI: fixture-first. No Clerk keys, no Convex URL.
      VITE_EH_DATA: fixture

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup aube + Node
        uses: jdx/aube-action@v1
        with:
          version: latest
          node-version: "22"
          run-install: false

      - name: Install dependencies (frozen lockfile)
        run: aube ci

      # Prefer committed convex/_generated over cloud codegen in CI.
      # Do not spin CONVEX_AGENT_MODE=anonymous here (junk deployments).
      - name: Convex codegen (skip without deployment)
        run: |
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            aubx convex codegen
          else
            echo "No CONVEX_DEPLOYMENT — using committed convex/_generated"
            test -f convex/_generated/api.d.ts
            test -f convex/_generated/dataModel.d.ts
            test -f convex/_generated/server.d.ts
          fi

      - name: Lint
        run: aubr lint

      - name: Typecheck
        run: aubr typecheck

      - name: Format check
        run: aubr format:check

      - name: Unit tests
        run: aubr test:once

      - name: Dependency audit
        run: aube audit --audit-level high
