<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EH Slice 4 art tokens</title>
    <style>
      body {
        font-family: Nunito, system-ui, sans-serif;
        background: #1b1430;
        color: #f4f0ff;
        padding: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      img {
        width: 128px;
        height: 128px;
        border-radius: 20px;
        border: 2px solid #ffffff33;
      }
      .swatch {
        height: 12px;
        border-radius: 999px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Hangar art pack (placeholders)</h1>
    <p>
      Reduced-motion: hub/level-up CSS strips required parallax/video/confetti.
    </p>
    <div class="grid">
      <figure>
        <img src="../../../public/art/paint_default.webp" alt="paint_default" />
        <figcaption>paint_default</figcaption>
        <div class="swatch" style="background: #2ec4b6"></div>
      </figure>
      <figure>
        <img
          src="../../../public/art/paint_nebula_01.webp"
          alt="paint_nebula_01"
        />
        <figcaption>paint_nebula_01</figcaption>
        <div class="swatch" style="background: #e056a0"></div>
      </figure>
      <figure>
        <img
          src="../../../public/art/paint_solar_01.webp"
          alt="paint_solar_01"
        />
        <figcaption>paint_solar_01</figcaption>
        <div class="swatch" style="background: #f0c75e"></div>
      </figure>
      <figure>
        <img src="../../../public/art/scope_teal_01.webp" alt="scope_teal_01" />
        <figcaption>scope_teal_01</figcaption>
        <div class="swatch" style="background: #2ec4b6"></div>
      </figure>
      <figure>
        <img
          src="../../../public/art/planet_rocky_01.webp"
          alt="planet_rocky_01"
        />
        <figcaption>planet_rocky_01</figcaption>
        <div class="swatch" style="background: #ff8a4c"></div>
      </figure>
      <figure>
        <img src="../../../public/art/ship_base.webp" alt="ship_base" />
        <figcaption>ship_base</figcaption>
        <div class="swatch" style="background: #2ec4b6"></div>
      </figure>
      <figure>
        <img src="../../../public/art/bh_unlock_01.webp" alt="bh_unlock_01" />
        <figcaption>bh_unlock_01</figcaption>
        <div class="swatch" style="background: #2ec4b6"></div>
      </figure>
    </div>
  </body>
</html>
